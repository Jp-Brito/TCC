<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ônibus ao Vivo SP</title>
  <meta name="description" content="Acompanhe os ônibus de São Paulo em tempo real no mapa.">

  <!-- Aplica o tema salvo antes de desenhar a página (evita piscar) -->
  <script>
    try {
      var t = localStorage.getItem("busjp-tema");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f0f14" id="metaTema">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OVSP">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <!-- Fonte do logo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&display=swap">

  <!-- Leaflet (versão fixa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Início">
      <span class="brand__name" id="brandName">Ônibus ao Vivo SP</span>
    </a>

    <div class="actions">
      <button class="icon-btn" id="btnInstalar" type="button" aria-label="Instalar como aplicativo" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12"></path><path d="M7 11l5 5 5-5"></path><path d="M5 21h14"></path>
        </svg>
      </button>

      <button class="icon-btn" id="btnBusca" type="button" aria-label="Buscar linha ou ponto">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <button class="icon-btn" id="btnTema" type="button" aria-label="Alternar tema claro e escuro">
        <svg class="ico-sol" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="ico-lua" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main class="map-wrap">
    <div id="map" role="application" aria-label="Mapa da cidade de São Paulo"></div>
    <div id="aviso" class="toast" role="status" hidden></div>
  </main>

  <!-- Painel de baixo: previsões da parada tocada -->
  <section id="painel" class="painel" role="region" aria-label="Previsões de chegada">
    <div class="painel__alca" aria-hidden="true"></div>
    <header class="painel__topo">
      <div class="painel__textos">
        <h2 id="painelTitulo" class="painel__titulo"></h2>
        <p id="painelSub" class="painel__sub"></p>
        <p id="painelResumo" class="painel__resumo"></p>
      </div>
      <div class="painel__botoes">
        <button id="painelMinimizar" class="icon-btn icon-btn--pequeno" type="button" aria-label="Minimizar painel" aria-expanded="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <button id="painelFechar" class="icon-btn icon-btn--pequeno" type="button" aria-label="Fechar painel">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>
    <div id="painelCorpo" class="painel__corpo"></div>
    <footer id="painelRodape" class="painel__rodape"></footer>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/paradas.js"></script>
  <script src="js/painel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
